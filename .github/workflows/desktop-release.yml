name: 桌面安装包

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：填写现有 v* 标签时覆盖对应 Release 的附件与说明"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64 DMG
            os: macos-latest
            target: mac
            artifact: ai8video-macos-arm64
            package_glob: desktop/electron/dist/*.dmg
          - label: Windows x64 EXE
            os: windows-latest
            target: win
            artifact: ai8video-windows-x64
            package_glob: desktop/electron/dist/*.exe

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/electron/package-lock.json

      - name: 安装 Python 构建依赖
        run: python -m pip install ".[ai8video]" "pyinstaller==6.21.0"

      - name: 安装 HyperFrames 运行时
        run: npm ci

      - name: 冻结 Python 后端
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --distpath build/frozen
          --workpath build/pyinstaller
          desktop/runtime/ai8video_backend.spec

      - name: 暂存独立桌面运行时
        run: >-
          python desktop/runtime/stage_release.py
          --backend-dir build/frozen/ai8video-backend
          --target desktop/electron/runtime

      - name: 暂存 HyperFrames Node 依赖
        run: >-
          node desktop/runtime/stage_node_runtime.mjs
          node_modules
          desktop/electron/runtime/node_modules

      - name: 安装 Electron 构建依赖
        working-directory: desktop/electron
        run: npm ci

      - name: 检查 macOS 签名与公证配置
        id: mac_signing
        if: matrix.target == 'mac'
        working-directory: desktop/electron
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node ../runtime/check_signing_config.mjs mac

      - name: 检查 Windows 签名配置
        id: win_signing
        if: matrix.target == 'win'
        working-directory: desktop/electron
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node ../runtime/check_signing_config.mjs win

      - name: 生成已签名 macOS 安装包
        if: matrix.target == 'mac' && steps.mac_signing.outputs.signing == 'true'
        working-directory: desktop/electron
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.mac_signing.outputs.csc_identity_auto_discovery }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac:signed

      - name: 生成 ad-hoc macOS 安装包
        if: matrix.target == 'mac' && steps.mac_signing.outputs.signing != 'true'
        working-directory: desktop/electron
        run: npm run dist:mac

      - name: 生成 Windows 安装包
        if: matrix.target == 'win'
        working-directory: desktop/electron
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.win_signing.outputs.csc_identity_auto_discovery }}
        run: npm run dist:win

      - name: 验证 macOS 签名与公证
        if: matrix.target == 'mac'
        shell: bash
        env:
          SIGNING_ENABLED: ${{ steps.mac_signing.outputs.signing }}
          NOTARIZATION_ENABLED: ${{ steps.mac_signing.outputs.notarization }}
        run: |
          set -euo pipefail
          app_path="$(find desktop/electron/dist -maxdepth 2 -type d -name 'AI8video.app' -print -quit)"
          test -n "$app_path"
          signature_details="$(codesign -dv --verbose=4 "$app_path" 2>&1 || true)"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          if [[ "$SIGNING_ENABLED" == "true" ]]; then
            if [[ "$signature_details" != *"Authority="* || "$signature_details" == *"Signature=adhoc"* ]]; then
              echo "::error::macOS 构建未使用受信代码签名身份"
              exit 1
            fi
          else
            if [[ "$signature_details" == *"Authority="* ]]; then
              echo "::error::未配置证书时不应生成受信签名制品"
              exit 1
            fi
            if [[ "$signature_details" != *"Signature=adhoc"* ]]; then
              echo "::error::未配置证书时仍必须生成结构完整的 ad-hoc 签名"
              exit 1
            fi
            echo "已确认 macOS 制品的 ad-hoc 签名结构有效；该制品仍未获得 Gatekeeper 信任"
          fi
          if [[ "$NOTARIZATION_ENABLED" == "true" ]]; then
            xcrun stapler validate "$app_path"
            spctl -a -vv --type execute "$app_path"
          fi

      - name: 验证 Windows 签名
        if: matrix.target == 'win'
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ steps.win_signing.outputs.signing }}
        run: |
          $installer = Get-ChildItem "desktop/electron/dist" -Filter "*.exe" -File | Select-Object -First 1
          $app = Get-Item "desktop/electron/dist/win-unpacked/AI8video.exe"
          $backend = Get-Item "desktop/electron/dist/win-unpacked/resources/runtime/backend/ai8video-backend.exe"
          if (-not $installer) { throw "没有找到 Windows 安装包" }
          $expectedStatus = if ($env:SIGNING_ENABLED -eq "true") { "Valid" } else { "NotSigned" }
          foreach ($target in @($installer, $app, $backend)) {
            $status = (Get-AuthenticodeSignature $target.FullName).Status.ToString()
            Write-Host "$($target.Name): $status"
            if ($status -ne $expectedStatus) {
              throw "$($target.Name) 签名状态应为 $expectedStatus，实际为 $status"
            }
          }

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ steps.mac_signing.outputs.status || steps.win_signing.outputs.status }}
          path: ${{ matrix.package_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下载安装包
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Release 标签必须以 v 开头：$RELEASE_TAG"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git show -s --format='%B' "$GITHUB_SHA" > release-notes.md
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" --notes-file release-notes.md
            else
              gh release create "$RELEASE_TAG" --verify-tag --notes-file release-notes.md
            fi
          elif ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --notes-from-tag
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
